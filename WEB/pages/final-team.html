<link rel="stylesheet" href="../css/styles/style.css">

<!-- Верхняя розовая полоса -->
<div class="final-header"></div>
<div class="final-title">Итоговый состав команды</div>
<div class="final-subtitle">Раундов пройдено: <span id="rounds-completed"></span> из <span id="max-rounds"></span></div>

<!-- Блок "Количество:" -->
<div class="final-count-label">Количество:</div>

<!-- Статистика -->
<div class="final-stats">
    <div class="final-stats-badge"></div>
    <div class="final-stats-count" id="final-stats-count">0</div>
</div>

<!-- Список итоговых игроков (динамически заполняется) -->
<div class="final-players-list"></div>

<!-- Кнопка "Вскрыть все карты" (доступна для создателя) -->
<div class="final-reveal-btn" id="final-reveal-btn">
    <div class="final-reveal-badge"></div>
    <div class="final-reveal-text">Вскрыть все карты</div>
</div>

<!-- Кнопка "Посмотреть результаты" -->
<div class="final-results-btn" id="final-results-btn">
    <div class="final-results-badge"></div>
    <div class="final-results-text">Посмотреть результаты</div>
</div>
